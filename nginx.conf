events {
    worker_connections 1024;
}

http {
    upstream device_auth_backend {
        # 至少两个应用服务进程，轮询分担并发批准/拒绝/轮询
        server app1:8000;
        server app2:8000;
    }

    server {
        listen 80;
        server_name _;

        # 演示页面与 API 统一入口
        location / {
            proxy_pass http://device_auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 35s;
        }
    }
}
